
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Under Construction</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    .video-background {
        position: relative;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background: #000;
    }

    .video-background video {
        position: absolute;
        top: 50%;
        left: 50%;

        width: 100%;
        height: 100%;

        object-fit: cover;
        object-position: center;

        transform: translate(-50%, -50%);
    }

    .overlay {
        position: absolute;
        inset: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 20px;

        background: rgba(0, 0, 0, 0.50);
        z-index: 1;
    }

    .overlay h1 {
        color: #ffffff;

        font-family: Arial, sans-serif;
        font-size: clamp(28px, 6vw, 80px);
        font-weight: 700;

        text-align: center;
        text-transform: uppercase;
        letter-spacing: clamp(2px, 0.8vw, 8px);

        line-height: 1.2;
        max-width: 100%;
        overflow-wrap: break-word;
    }

    /* Tablet */
    @media (max-width: 768px) {
        .overlay h1 {
            font-size: clamp(28px, 7vw, 55px);
            letter-spacing: 3px;
        }
    }

    /* Mobile */
    @media (max-width: 480px) {
        .overlay {
            padding: 15px;
        }

        .overlay h1 {
            font-size: clamp(24px, 8vw, 36px);
            letter-spacing: 2px;
            line-height: 1.3;
        }

        .video-background video {
            object-position: center;
        }
    }
</style>
</head>

<body>

<div class="video-background">

    <video autoplay muted loop playsinline>
        <source src="cooming_soon.mp4" type="video/mp4">
        Your browser does not support HTML video.
    </video>

    <div class="overlay">
        <h1>Coming Soon</h1>
    </div>

</div>

</body>
</html>
